function portalMarkup(settings=false){let picker=typeof window.showDirectoryPicker==='function';return `<div class="portalOverlay" id="portalOverlay"><div class="portalCard"><div class="portalHead"><div class="brandLine"><span class="brandMark">B</span><strong>BIOCOLD PROCESS</strong></div><h2>${settings?'Stockage des dossiers':'Configuration du poste franchisé'}</h2><p>La fiche papier BIOCOLD reste le document terrain de référence. L'application complète la saisie, les calculs et les synthèses.</p></div><div class="portalBody"><div class="portalField"><label>Nom du franchisé / secteur<input id="portalFranchisee" type="text" value="${esc(portalProfile.franchisee||'')}" placeholder="Ex. Aveyron - Matthieu"></label></div><div class="portalIntro"><section class="portalChoice"><h3>Choisir un dossier de travail</h3><p>Les dossiers sont enregistrés automatiquement dans un fichier BIOCOLD placé dans le dossier choisi. Un dossier OneDrive synchronisé sur l'appareil peut être sélectionné.</p><button class="primary" id="chooseFolder" ${picker?'':'disabled'}>Choisir le dossier</button></section><section class="portalChoice"><h3>Stockage sur cet appareil</h3><p>Mode de secours lorsque le navigateur ou la tablette ne permet pas l'accès direct à un dossier. Les données restent dans le navigateur et peuvent être exportées.</p><button class="secondary" id="useDevice">Utiliser cet appareil</button></section></div>${picker?'':`<div class="portalNotice warn">Ce navigateur ne permet pas de choisir directement un dossier. Utilisez pour l'instant « Stockage sur cet appareil ». Le mode dossier sera disponible sur un navigateur compatible.</div>`}<div class="portalStatusBox"><div><strong>Stockage actuel</strong><small>${portalProfile.mode==='folder'?(folderReady?'Dossier : '+esc(portalProfile.folderName||'sélectionné'):'Dossier configuré - autorisation à rétablir'):portalProfile.mode==='device'?'Sur cet appareil':'Non configuré'}</small></div>${settings&&portalProfile.mode==='folder'?`<but function ident(){let c=CFG[dossier.metier],f=c.firstPage||{};let opening=f.opening?unitInput('sans.econ.joursSemaine',"Jours d'ouverture",'','step="1" min="0" max="7"'):'';let closing=f.closing?closingDaysPanel():'';let syndicat=f.syndicat?`${textInput('ident.syndicat','Adhérent à un syndicat','bool')}${dossier.ident.syndicat===true?textInput('ident.syndicatNom','Nom du syndicat'):''}`:'';let spaces=dossier.ident.espaces.map((s,i)=>{let isRoom=s.type==='Chambre froide',isMeuble=s.type==='Meuble froid',hideDimensions=['Meuble froid','Vitrine'].includes(s.type),showVolume=f.volume&&isRoom,showDimensions=f.dimensions&&!hideDimensions,detail=isMeuble?`<label>Précision meuble <select data-space-detail="${i}"><option value="">--</option>${['Top','1 porte','2 portes'].map(x=>`<option value="${x}" ${s.materielDetail===x?'selected':''}>${x}</option>`).join('')}</select></label>`:'';let usage=`<label class="spaceUsage">Désignation / usage<input type="text" data-path="ident.espaces.${i}.usage" value="${esc(s.usage||'')}" placeholder="Ex. chambre froide carcasses, rembal, produits frais…"></label>`;return `<div class="spaceRow ${isMeuble?'withDetail':''}"><label>Espace évalué<select data-space-type="${i}">${c.spaces.map(x=>`<option ${x===s.type?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${detail}${showVolume?`<label>Volume<div class="unit"><input type="number" data-space-volume="${i}" value="${s.volume||''}" step="0.1"><span>m3</span></div></label>`:''}${showDimensions?`<label>Dimensions<input type="text" data-path="ident.espaces.${i}.dimensions" value="${esc(s.dimensions||'')}"></label>`:''}<button type="button" class="spaceRemove" data-space-remove="${i}">Supprimer</button>${usage}</div>`}).join('');return `<fieldset><legend>Identification &middot; fiche d'essai</legend><div class="fields three">${textInput('ident.numeroEssai',"Numéro d'essai")}${syndicat}${textInput('ident.dateEssai',"Date de l'essai")}${opening}${closing}${textInput('ident.client','Nom Etablissement')}${textInput('ident.adresse','Adresse')}${textInput('ident.cp','Code postal')}${textInput('ident.ville','Ville')}${textInput('ident.responsable',"Nom et prénom du responsable de l'évaluation")}${textInput('ident.fonction',"Fonction du responsable de l'évaluation")}${phoneInput('ident.telephoneFixe','Téléphone fixe')}${phoneInput('ident.telephonePortable','Téléphone portable')}${textInput('ident.email','Email')}</div></fieldset>${f.expectations?`<fieldset class="expectationsBox"><legend>Vos attentes</legend><textarea data-path="ident.attentes">${esc(dossier.ident.attentes||'')}</textarea></fieldset>`:''}<fieldset><legend>Espace réfrigéré évalué</legend><div class="spaceList">${spaces}</div><button type="button" class="secondary spaceAdd" id="addSpace">+ Ajouter un espace évalué</button>${f.typeSpace?`<div class="fields two" style="margin-top:14px">${textInput('ident.typeEspace',"Type d'espace évalué")}</div>`:''}</fieldset><fieldset><legend>Filtres Stabilisateurs&reg;</legend><div class="fields four">${unitInput('ident.cassettes','Nombre cassettes','')}${unitInput('ident.canettes','Nombre canettes','')}${unitInput('ident.baguettes','Nombre baguettes','')}${unitInput('ident.fusettes','Nombre fusettes','')}</div></fieldset>`}
function checkPanel(){let k=0,c=CFG[dossier.metier],extra=c.initialParticularsLabel?`<fieldset><legend>${esc(c.initialParticularsLabel)}</legend><textarea data-path="sans.particulars">${esc(dossier.sans.particulars||'')}</textarea></fieldset>`:'';return `<fieldset><legend>1&egrave;re visite d'&eacute;valuation &middot; sans Filtres Stabilisateurs&reg;</legend><div class="checkGroups">${(c.sansGroups||[]).map(([g,items])=>`<section class="checkGroup"><h3>${esc(g)}</h3>${items.map(q=>{let id=String(k++);return `<button type="button" class="checkBtn ${dossier.sans.checks[id]?'on':''}" data-sans-check="${id}"><span class="checkSquare"></span><span>${esc(q)}</span></button>`}).join('')}</section>`).join('')}</div></fieldset>${extra}`}
function econPanel(){let c=CFG[dossier.metier];let renderField=([k,l,u])=>{if(c.gainMode==='boulangerie'&&k==='methode'){let opts=c.methodOptions||[],cur=dossier.sans.econ[k]||'';return `<label>${esc(l)}<select data-path="sans.econ.${k}"><option value="">--</option>${opts.map(o=>`<option value="${esc(o)}" ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}if(u==='text'||u==='bool')return textInput('sans.econ.'+k,l,u);let attrs=u==='%'?'max="100" step="1"':k==='joursSemaine'?'step="1" min="0" max="7" inputmode="numeric"':k==='joursAn'?'step="1" min="0" inputmode="numeric"':'step="0.1"';return unitInput('sans.econ.'+k,l,u,attrs)};let fields=(c.econFields||[]).filter(([k])=>!(c.firstPage?.opening&&k==='joursSemaine')).map(renderField).join('');let context=(c.contextFields||[]).map(renderField).join('');let fam='';if(c.caFamilies){let shares=dossier.sans.econ.familyShares||{},shareInput=l=>`<div class="taskRow"><label>${esc(l)}</label><div class="unit"><input type="number" data-family="${slug(l)}" value="${shares[slug(l)]??''}" step="1" min="0" max="100"><span>%</span></div></div>`;if(c.collectivitesEconomicsLayout){let prep=c.caFamilies.filter(x=>x[1]==='preparation'),achat=c.caFamilies.filter(x=>x[1]==='achat');fam=`<fieldset><legend>Répartition du coût d'un repas</legend><div class="businessTable">${prep.map(([l])=>shareInput(l)).join('')}</div></fieldset><fieldset><legend>% Achats Produits Frais</legend><div class="businessTable">${achat.map(([l])=>shareInput(l)).join('')}</div></fieldset>`;let mat=n(dossier.sans.econ.coutMatiere)*n(dossier.sans.econ.repasJour),pers=n(dossier.sans.econ.coutPersonnel)*n(dossier.sans.econ.repasJour);fam+=`<div class="liveCalc"><span>Coût matières / jour <strong>${EUR.format(mat)}</strong></span><span>Coût personnel / jour <strong>${EUR.format(pers)}</strong></span></div>`}else fam=`<fieldset><legend>Repartition par familles</legend><div class="businessTable">${c.caFamilies.map(([l])=>shareInput(l)).join('')}</div></fieldset>`}return `${context?`<fieldset><legend>Donnees metier</legend><div class="fields three">${context}</div></fieldset>`:''}${fields?`<fieldset><legend>Donnees economiques / activite</legend><div class="fields three">${fields}</div></fieldset>`:''}${fam}`}

ck" style="margin-top:14px"><h3>Réception de marchandises et courses</h3><div class="boulOrtRows">${charcOrtGainInput('receptionsReduction','Réduction du nombre par semaine','','step="1" min="0"')}</div></section><div class="kpiStrip"><div><span>Personnel nettoyage</span><strong>${EUR.format(co.cleanStaff)}</strong></div><div><span>Produits / ustensiles</span><strong>${EUR.format(co.cleanProducts)}</strong></div><div><span>Film</span><strong>${EUR.format(co.film)}</strong></div><div><span>Préparation + réception</span><strong>${EUR.format(co.prep+co.reception)}</strong></div></div></fieldset>`;return part===1?part1:part===2?part2:part1+part2}

function fruitsBreakdown(r){let e=dossier.sans.econ,rows=dossier.sans.lossRows,days=n(e.joursAn),globalAnnual=n(e.caGlobalAnnuel)||(n(e.caGlobalJour)&&days?n(e.caGlobalJour)*days:0),flAnnual=n(e.caFruitsLegumesAnnuel),pctF=n(e.pctFruits),pctL=n(e.pctLegumes),mix=pctF+pctL,fruitAnnual=(n(e.caFruitsJour)&&days?n(e.caFruitsJour)*days:0)||(globalAnnual&&pctF?globalAnnual*pctF/100:0)||(flAnnual&&mix?flAnnual*pctF/mix:0),legumeAnnual=(n(e.caLegumesJour)&&days?n(e.caLegumesJour)*days:0)||(globalAnnual&&pctL?globalAnnual*pctL/100:0)||(flAnnual&&mix?flAnnual*pctL/mix:0),shares=familyShares(),values=rows.map(()=>0);[['fruit',fruitAnnual],['legume',legumeAnnual]].forEach(([gp,annual])=>{let fam=(CFG[dossier.metier].caFamilies||[]).filter(x=>x[1]===gp),grows=rows.filter(x=>x.group===gp);fam.forEach(([l],j)=>{let row=grows[j],shr=n(shares[slug(l)]),i=rows.indexOf(row);values[i]=annual*(shr/100)*(rowLoss(row||{})/100)*(n(r.gains[i]?.reduction)/100)/12})});let fruits=values.slice(0,5).reduce((a,b)=>a+b,0),legumes=values.slice(5,10).reduce((a,b)=>a+b,0);return {values,fruits,legumes,total:fruits+legumes}}

function boucherieGainPanel(){let r=dossier.retours[returnIndex],c=CFG[dossier.metier],choice=(field,opts,current,unit,max=null)=>{let cur=current===null||current===undefined||current===''?null:Number(current),custom=cur!==null&&!opts.includes(cur)?cur:'';return `<div class="fixedChoiceWithManual"><div class="riskGrid">${opts.map(v=>`<button type="button" class="riskPct ${cur===v?'on':''}" data-global-choice="${field}" data-value="${v}">${v}${unit}</button>`).join('')}</div><div class="fixedChoiceManual"><label>Autre valeur<div class="unit"><input type="number" data-global="${field}" value="${custom}" step="0.1" min="0" ${max!==null?`max="${max}"`:''}><span>${esc(unit.trim())}</span></div></label></div></div>`};return `<fieldset><legend>Gains réalisés</legend><div class="boulGainGroups"><section class="boulGainGroup"><h3>Ralentissement de la maturation</h3><div class="factorWrap"><span>Jours supplémentaires</span>${choice('maturationDays',c.maturationOptions||[],r.maturationDays,' j')}</div></section><section class="boulGainGroup"><h3>Prolongation de la conservation</h3><div class="factorWrap"><span>Jours</span>${choice('conservationDays',c.extensionOptions||[],r.conservationDays,' j')}</div></section><section class="boulGainGroup"><h3>Diminution du parage</h3><div class="factorWrap"><span>Pourcentage</span>${choice('parageReduction',c.reductionOptions||[],r.parageReduction,' %',100)}</div></section><section class="boulGainGroup"><h3>Diminution des pertes</h3><div class="factorWrap"><span>Pourcentage</span>${choice('globalReduction',c.reductionOptions||[],r.globalReduction,' %',100)}</div></section></div></fieldset><fieldset><legend>Prix moyen au kg</legend><div class="fields two"><label>Prix moyen au Kg<div class="unit"><input type="number" data-global="prixKg" value="${r.prixKg??dossier.sans.econ.prixKg??''}" step="0.1" min="0"><span>€</span></div></label></div></fieldset>`}

function returnMissing(){let r=dossier.retours[returnIndex],m=[],mode=CFG[dossier.metier].gainMode;if(!r.date)m.push('Date du retour');if(!Object.keys(r.evals||{}).length)m.push('Évaluation avec Filtres Stabilisateurs : aucune case cochée');if(mode==='restaurant'&&r.globalReduction===null)m.push('Diminution des pertes');else if(mode==='boucherie'){if(r.prixKg==null||n(r.prixKg)<=0)m.push('Prix moyen au Kg');if(r.globalReduction===null&&r.parageReduction===null)m.push('Diminution des pertes / parage')}else if(mode==='fleuriste'){if(r.globalReduction===null)m.push('Diminution des pertes')}else if(mode==='collectivites'){dossier.sans.lossRows.forEach((x,i)=>{let label=x.label||x.name;if(label&&rowLoss(x)>0&&r.gains[i]?.reduction===null)m.push(`R\u00e9duction avec : ${label}`)})}else if(!['restaurant','boucherie'].includes(mode)){dossier.sans.lossRows.forEach((x,i)=>{if(rowLoss(x)>0&&r.gains[i]?.reduction===null)m.push(`R\u00e9duction avec : ${x.label}`)})}if(!r.reducFroid)m.push('Électricité : réduction de sollicitation');return m}
